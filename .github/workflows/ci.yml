name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: make ci
      - name: Scheduling experiments (printed to the job summary)
        run: make scheduling | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install OSV-Scanner v2.7.0 (checksum-verified)
        run: |
          curl -sSfLo "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Known-vulnerability audit
        run: make audit

  # The same Python suite on the free-threaded build, where threads really run in parallel.
  python-free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"
      - name: Install
        run: cd python && python -m pip install -e . pytest pytest-timeout
      - name: Confirm the GIL is off
        run: python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled'; print(sys.version)"
      - name: Test
        run: cd python && python -m pytest -q
      - name: Scheduling experiments
        run: cd python && python -m concurrency_across_runtimes.scheduling | tee -a "$GITHUB_STEP_SUMMARY"
